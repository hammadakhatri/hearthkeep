[project]
name = "hearthkeep"
version = "0.0.0"
description = "Hearthkeep: your private AI, at home."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearthkeep"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
