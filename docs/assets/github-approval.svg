<svg xmlns="http://www.w3.org/2000/svg" width="560" height="556" viewBox="0 0 560 556" role="img" aria-label="A Hearthkeep approval card for a push. Needs your approval: Push a branch to GitHub for sample/widgets. Repo sample/widgets, branch hearthkeep/fix-readme, two commits, and the full diff: README.md with one line removed and one added, and a new test file with three added lines. Buttons: Approve, with a passkey icon, and Decline. Approving asks for Face ID / Touch ID.">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.8">
      <stop offset="0" stop-color="#ffb340" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffb340" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="f1"><rect x="38" y="216" width="484" height="130" rx="10"/></clipPath>
    <clipPath id="f2"><rect x="38" y="354" width="484" height="110" rx="10"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Consolas, Menlo, monospace; }
    .kick { font-size: 11.5px; font-weight: 500; fill: #ffb340; }
    .title { font-size: 16px; font-weight: 650; fill: #f5f5f7; }
    .tool { font-size: 12px; fill: #86868b; }
    .dt { font-size: 13.5px; fill: #86868b; }
    .dd { font-size: 13.5px; fill: #f5f5f7; }
    .li { font-size: 12.5px; fill: #f5f5f7; }
    .path { font-size: 12.5px; font-weight: 500; fill: #f5f5f7; }
    .no { font-size: 12.5px; fill: #86868b; text-anchor: end; }
    .ln { font-size: 12.5px; fill: #c7c7cc; }
    .hunk { font-size: 12.5px; fill: #86868b; }
    .add { font-size: 12.5px; fill: #32d74b; }
    .del { font-size: 12.5px; fill: #ff6961; }
    .note { font-size: 12px; fill: #86868b; }
  </style>

  <rect width="560" height="556" rx="24" fill="#000"/>
  <rect width="560" height="556" rx="24" fill="url(#glow)"/>

  <!-- the card -->
  <rect x="20" y="20" width="520" height="516" rx="18" fill="#0e0e10" stroke="#7f6135"/>

  <!-- header -->
  <circle cx="41" cy="44" r="3" fill="#ffb340"/>
  <circle cx="41" cy="44" r="6" fill="#ffb340" fill-opacity="0.18"/>
  <text x="51" y="48" class="kick">Needs your approval</text>
  <text x="38" y="74" class="title">Push a branch to GitHub for sample/widgets</text>
  <text x="38" y="94" class="tool mono">github</text>

  <!-- facts -->
  <text x="38" y="124" class="dt">Repo</text>
  <text x="126" y="124" class="dd">sample/widgets</text>
  <text x="38" y="144" class="dt">Branch</text>
  <text x="126" y="144" class="dd">hearthkeep/fix-readme</text>
  <text x="38" y="164" class="dt">Commits</text>
  <text x="126" y="164" class="li mono">e4f5a6b Add a test for parse_size</text>
  <text x="126" y="183" class="li mono">a1b2c3d Fix the install link in the README</text>
  <text x="38" y="203" font-size="12" fill="#86868b">Head</text>
  <text x="126" y="203" font-size="12" fill="#86868b" class="mono">e4f5a6b</text>

  <!-- file 1 -->
  <g clip-path="url(#f1)">
    <rect x="38" y="216" width="484" height="130" fill="#000"/>
    <rect x="38" y="216" width="484" height="30" fill="#161618"/>
    <rect x="38" y="286" width="484" height="20" fill="#240f0e"/>
    <rect x="38" y="306" width="484" height="20" fill="#071e0a"/>
  </g>
  <rect x="38" y="216" width="484" height="130" rx="10" fill="none" stroke="#2a2a2e"/>
  <text x="50" y="235" class="path mono">README.md</text>
  <text x="482" y="235" font-size="12" fill="#32d74b" text-anchor="end" class="mono">+1</text>
  <text x="510" y="235" font-size="12" fill="#ff6961" text-anchor="end" class="mono">-1</text>

  <text x="133" y="260" class="hunk mono">@@ -12,3 +12,3 @@</text>
  <text x="69" y="280" class="no mono">12</text><text x="102" y="280" class="no mono">12</text>
  <text x="133" y="280" class="ln mono">## Install</text>
  <text x="69" y="300" class="no mono">13</text>
  <text x="110" y="300" class="del mono">-</text>
  <text x="133" y="300" class="del mono">See docs/setup.md for the steps.</text>
  <text x="102" y="320" class="no mono">13</text>
  <text x="110" y="320" class="add mono">+</text>
  <text x="133" y="320" class="add mono">See docs/install.md for the steps.</text>
  <text x="69" y="340" class="no mono">14</text><text x="102" y="340" class="no mono">14</text>
  <text x="133" y="340" class="ln mono">Python 3.12 or newer.</text>

  <!-- file 2 -->
  <g clip-path="url(#f2)">
    <rect x="38" y="354" width="484" height="110" fill="#000"/>
    <rect x="38" y="354" width="484" height="30" fill="#161618"/>
    <rect x="38" y="404" width="484" height="60" fill="#071e0a"/>
  </g>
  <rect x="38" y="354" width="484" height="110" rx="10" fill="none" stroke="#2a2a2e"/>
  <text x="50" y="373" class="path mono">tests/test_size.py</text>
  <text x="482" y="373" font-size="12" fill="#32d74b" text-anchor="end" class="mono">+3</text>
  <text x="510" y="373" font-size="12" fill="#ff6961" text-anchor="end" class="mono">-0</text>

  <text x="133" y="398" class="hunk mono">@@ -0,0 +1,3 @@</text>
  <text x="102" y="418" class="no mono">1</text>
  <text x="110" y="418" class="add mono">+</text>
  <text x="133" y="418" class="add mono">from widgets.size import parse_size</text>
  <text x="102" y="438" class="no mono">2</text>
  <text x="110" y="438" class="add mono">+</text>
  <text x="133" y="438" class="add mono">def test_parse_size():</text>
  <text x="102" y="458" class="no mono">3</text>
  <text x="110" y="458" class="add mono">+</text>
  <text x="133" y="458" class="add mono">    assert parse_size("2 KB") == 2048</text>

  <!-- footer -->
  <rect x="38" y="482" width="118" height="36" rx="18" fill="#f5f5f7"/>
  <g transform="translate(54 491) scale(0.75)" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 10v1M15 10v1M12 10v3h-1M9.5 16a4 4 0 0 0 5 0"/>
  </g>
  <text x="80" y="505" font-size="13.5" font-weight="500" fill="#000">Approve</text>
  <text x="172" y="505" font-size="13.5" font-weight="500" fill="#2997ff">Decline</text>
  <text x="522" y="505" class="note" text-anchor="end">Approving asks for Face ID / Touch ID</text>
</svg>
