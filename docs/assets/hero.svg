<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Hearthkeep on a phone: a CSV is attached, and the assistant answers with checked numbers and a chart showing a 13-day gap in March.">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2997ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2997ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ab0ff"/>
      <stop offset="1" stop-color="#1a6fd6"/>
    </linearGradient>
    <clipPath id="screen"><rect x="574" y="44" width="300" height="472" rx="34"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h1 { font-size: 46px; font-weight: 700; fill: #f5f5f7; letter-spacing: -1px; }
    .lede { font-size: 19px; fill: #c7c7cc; }
    .pill { font-size: 14px; fill: #f5f5f7; font-weight: 500; }
    .small { font-size: 12.5px; fill: #c7c7cc; }
    .tiny { font-size: 10.5px; fill: #86868b; }
    .msg { font-size: 12.5px; fill: #f5f5f7; }
    .bold { font-weight: 650; }
    .num { fill: #32d74b; font-weight: 650; text-decoration: underline; }
  </style>

  <rect width="960" height="560" rx="24" fill="#000"/>
  <circle cx="724" cy="250" r="330" fill="url(#glow)"/>

  <!-- Left: the promise -->
  <rect x="64" y="96" width="44" height="44" rx="12" fill="url(#mark)"/>
  <path d="M86 106 l13 10 v14 h-8 v-8 h-10 v8 h-8 v-14 z" fill="#fff"/>
  <text x="122" y="128" font-size="24" font-weight="650" fill="#f5f5f7">Hearthkeep</text>

  <text x="64" y="208" class="h1">Your private AI,</text>
  <text x="64" y="262" class="h1">at home.</text>
  <text x="64" y="306" class="lede">Runs on your own PC. Local models only.</text>
  <text x="64" y="334" class="lede">Reach it from your phone, nothing leaves.</text>

  <g transform="translate(64 372)">
    <rect width="168" height="36" rx="18" fill="#161618" stroke="#2a2a2e"/>
    <circle cx="20" cy="18" r="5" fill="#32d74b"/>
    <text x="34" y="23" class="pill">No cloud AI, ever</text>
    <rect x="178" width="176" height="36" rx="18" fill="#161618" stroke="#2a2a2e"/>
    <circle cx="198" cy="18" r="5" fill="#2997ff"/>
    <text x="212" y="23" class="pill">Passkey to approve</text>
    <rect y="46" width="214" height="36" rx="18" fill="#161618" stroke="#2a2a2e"/>
    <circle cx="20" cy="64" r="5" fill="#ffb340"/>
    <text x="34" y="69" class="pill">Numbers that show proof</text>
    <rect x="224" y="46" width="130" height="36" rx="18" fill="#161618" stroke="#2a2a2e"/>
    <circle cx="244" cy="64" r="5" fill="#c7c7cc"/>
    <text x="258" y="69" class="pill">Open source</text>
  </g>

  <!-- Right: a phone -->
  <rect x="562" y="32" width="324" height="496" rx="46" fill="#0e0e10" stroke="#2a2a2e" stroke-width="2"/>
  <g clip-path="url(#screen)">
    <rect x="574" y="44" width="300" height="472" fill="#000"/>

    <!-- top bar -->
    <rect x="590" y="62" width="18" height="18" rx="5" fill="url(#mark)"/>
    <text x="616" y="76" font-size="14" font-weight="650" fill="#f5f5f7">Chat</text>
    <rect x="770" y="61" width="88" height="20" rx="10" fill="#161618"/>
    <circle cx="782" cy="71" r="3.5" fill="#32d74b"/>
    <text x="790" y="75" class="tiny" fill="#c7c7cc">gemma-4-12b</text>
    <line x1="574" y1="94" x2="874" y2="94" stroke="#1f1f22"/>

    <!-- owner's message -->
    <rect x="652" y="106" width="208" height="64" rx="16" fill="#2997ff"/>
    <text x="666" y="128" class="msg" style="fill:#001a33">What's wrong with this file,</text>
    <text x="666" y="146" class="msg" style="fill:#001a33">and what happened to North</text>
    <text x="666" y="162" class="msg" style="fill:#001a33">in March?</text>
    <rect x="740" y="176" width="120" height="26" rx="8" fill="#161618" stroke="#2a2a2e"/>
    <rect x="749" y="183" width="10" height="12" rx="2" fill="none" stroke="#86868b"/>
    <text x="765" y="193" class="small">sales.csv · 1 KB</text>

    <!-- assistant reply -->
    <text x="590" y="230" class="msg">North has no rows from <tspan class="num">12</tspan> to <tspan class="num">24</tspan></text>
    <text x="590" y="249" class="msg">March, a <tspan class="num">13</tspan>-day gap, while the</text>
    <text x="590" y="268" class="msg">other regions kept trading.</text>

    <!-- findings card -->
    <rect x="590" y="280" width="268" height="168" rx="14" fill="#0e0e10" stroke="#2a2a2e"/>
    <text x="604" y="302" font-size="12" font-weight="650" fill="#f5f5f7">North, daily amount · March</text>
    <g fill="#2997ff">
      <rect x="606" y="372" width="5" height="34"/><rect x="613" y="390" width="5" height="16"/>
      <rect x="620" y="366" width="5" height="40"/><rect x="627" y="352" width="5" height="54"/>
      <rect x="634" y="360" width="5" height="46"/><rect x="641" y="380" width="5" height="26"/>
      <rect x="648" y="340" width="5" height="66"/><rect x="655" y="350" width="5" height="56"/>
      <rect x="662" y="354" width="5" height="52"/><rect x="669" y="376" width="5" height="30"/>
      <rect x="676" y="372" width="5" height="34"/>
      <rect x="774" y="364" width="5" height="42"/><rect x="781" y="360" width="5" height="46"/>
      <rect x="788" y="338" width="5" height="68"/><rect x="795" y="346" width="5" height="60"/>
      <rect x="802" y="334" width="5" height="72"/><rect x="809" y="374" width="5" height="32"/>
      <rect x="816" y="352" width="5" height="54"/>
    </g>
    <rect x="684" y="318" width="86" height="88" rx="6" fill="#ffb340" fill-opacity="0.12" stroke="#ffb340" stroke-opacity="0.55" stroke-dasharray="4 3"/>
    <text x="727" y="358" text-anchor="middle" font-size="11" font-weight="650" fill="#ffb340">no data</text>
    <text x="727" y="373" text-anchor="middle" class="tiny" style="fill:#ffb340">12–24 Mar</text>
    <line x1="604" y1="407" x2="844" y2="407" stroke="#2a2a2e"/>
    <text x="604" y="424" class="tiny">1 Mar</text>
    <text x="844" y="424" text-anchor="end" class="tiny">31 Mar</text>
    <rect x="604" y="432" width="7" height="3" fill="#32d74b"/>
    <text x="616" y="437" class="tiny">computed by code in the sandbox</text>

    <!-- also found -->
    <text x="590" y="470" class="small">Also found: <tspan class="num">3</tspan> negative amounts,</text>
    <text x="590" y="490" class="small"><tspan class="num">2</tspan> duplicate rows, <tspan class="num">4</tspan> odd date formats.</text>
  </g>
</svg>
