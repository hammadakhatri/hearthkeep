<svg xmlns="http://www.w3.org/2000/svg" width="880" height="468" viewBox="0 0 880 468" role="img" aria-label="Three layers for GitHub work. Look: reads with no lasting change, needs nothing at the Allowed level; for example reading and searching the code, listing pull requests and issues, checking CI, and running tests in the sandbox. Change local: changes on your PC only, needs an approval card once per chat; for example starting a hearthkeep/ branch, writing or deleting a file, and committing in the local copy. Outward: leaves your PC, needs an approval card and your passkey every time; for example pushing the approved commit, opening a pull request, commenting, merging or closing, and installing new dependencies. Never: push to the default branch, force-push, or push a commit you did not approve.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 22px; font-weight: 700; fill: #f5f5f7; letter-spacing: -0.4px; }
    .sub { font-size: 14px; fill: #c7c7cc; }
    .layer { font-size: 20px; font-weight: 650; fill: #f5f5f7; }
    .what { font-size: 12.5px; fill: #86868b; }
    .label { font-size: 11px; font-weight: 600; fill: #86868b; letter-spacing: 0.6px; }
    .need { font-size: 14px; font-weight: 650; }
    .ex { font-size: 13px; fill: #c7c7cc; }
    .dim { font-size: 13px; fill: #86868b; }
    .tiny { font-size: 12px; fill: #86868b; }
  </style>

  <rect width="880" height="468" rx="24" fill="#000"/>

  <text x="32" y="54" class="h">Three layers for GitHub work</text>
  <text x="32" y="80" class="sub">Every action is sorted into one layer. The further it reaches, the more it asks of you.</text>

  <!-- Look -->
  <rect x="32" y="108" width="245" height="248" rx="18" fill="#0e0e10" stroke="#2a2a2e"/>
  <circle cx="56" cy="138" r="5" fill="#32d74b"/>
  <text x="70" y="145" class="layer">Look</text>
  <text x="50" y="168" class="what">Reads, no lasting change</text>
  <line x1="50" y1="184" x2="259" y2="184" stroke="#2a2a2e"/>
  <text x="50" y="206" class="label">NEEDS</text>
  <text x="50" y="227" class="need" fill="#32d74b">Nothing, it just runs</text>
  <text x="50" y="258" class="label">FOR EXAMPLE</text>
  <text x="50" y="280" class="ex">Read and search the code</text>
  <text x="50" y="301" class="ex">List pull requests, issues</text>
  <text x="50" y="322" class="ex">Check CI status</text>
  <text x="50" y="343" class="ex">Run tests in the sandbox</text>

  <!-- arrow -->
  <path d="M285 232 h24 m-6 -6 l6 6 l-6 6" fill="none" stroke="#86868b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Change local -->
  <rect x="317" y="108" width="245" height="248" rx="18" fill="#0e0e10" stroke="#2a2a2e"/>
  <circle cx="341" cy="138" r="5" fill="#2997ff"/>
  <text x="355" y="145" class="layer">Change local</text>
  <text x="335" y="168" class="what">Changes on your PC only</text>
  <line x1="335" y1="184" x2="544" y2="184" stroke="#2a2a2e"/>
  <text x="335" y="206" class="label">NEEDS</text>
  <text x="335" y="227" class="need" fill="#ffb340">A card, once per chat</text>
  <text x="335" y="258" class="label">FOR EXAMPLE</text>
  <text x="335" y="280" class="ex">Start a hearthkeep/ branch</text>
  <text x="335" y="301" class="ex">Write or delete a file</text>
  <text x="335" y="322" class="ex">Commit in the local copy</text>
  <text x="335" y="343" class="dim">Nothing reaches GitHub</text>

  <!-- arrow -->
  <path d="M570 232 h24 m-6 -6 l6 6 l-6 6" fill="none" stroke="#86868b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Outward -->
  <rect x="602" y="108" width="245" height="248" rx="18" fill="#0e0e10" stroke="#7f6135"/>
  <circle cx="626" cy="138" r="5" fill="#ffb340"/>
  <text x="640" y="145" class="layer">Outward</text>
  <g transform="translate(811 126) scale(0.75)" fill="none" stroke="#ffb340" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 10v1M15 10v1M12 10v3h-1M9.5 16a4 4 0 0 0 5 0"/>
  </g>
  <text x="620" y="168" class="what">Leaves your PC</text>
  <line x1="620" y1="184" x2="829" y2="184" stroke="#2a2a2e"/>
  <text x="620" y="206" class="label">NEEDS</text>
  <text x="620" y="227" class="need" fill="#ffb340">Card + passkey, every time</text>
  <text x="620" y="258" class="label">FOR EXAMPLE</text>
  <text x="620" y="280" class="ex">Push the approved commit</text>
  <text x="620" y="301" class="ex">Open a pull request</text>
  <text x="620" y="322" class="ex">Comment, merge or close</text>
  <text x="620" y="343" class="ex">Install new dependencies</text>

  <!-- never -->
  <rect x="32" y="378" width="815" height="40" rx="20" fill="#161618" stroke="#2a2a2e"/>
  <circle cx="56" cy="398" r="7" fill="none" stroke="#86868b" stroke-width="1.6"/>
  <line x1="51" y1="403" x2="61" y2="393" stroke="#86868b" stroke-width="1.6"/>
  <text x="74" y="403" font-size="13" fill="#c7c7cc"><tspan font-weight="650" fill="#f5f5f7">Never:</tspan> push to the default branch, force-push, or push a commit you did not approve.</text>

  <text x="32" y="448" class="tiny">Shown at the Allowed level. GitHub starts at Ask, so every call asks first until you raise it.</text>
</svg>
