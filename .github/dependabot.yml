# Weekly update proposals, as pull requests that CI checks. Security fixes arrive sooner,
# through Dependabot security updates.
#
# A release is proposed only once it is 14 days old (cooldown), so a hijacked or broken release
# has time to be caught first. Minor and patch updates come grouped, one PR per ecosystem; a
# major version comes on its own, because it can change behaviour and needs its own testing.
version: 2
updates:
  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      server:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      web:
        update-types: [minor, patch]

  # The sandbox image: its pinned base image (Dockerfile) and hash-pinned packages.
  - package-ecosystem: docker
    directory: /server/src/hearthkeep/sandbox/image
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  - package-ecosystem: pip
    directory: /server/src/hearthkeep/sandbox/image
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      sandbox:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        update-types: [minor, patch]
