name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload its assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Install, test, build the web app
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Build the release assets
        run: uv run --project server python scripts/build_release.py --version "${GITHUB_REF_NAME#v}" --out "$RUNNER_TEMP/release"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/*
          --draft --verify-tag
          --title "Hearthkeep $GITHUB_REF_NAME"
          --notes "Release notes are on the way."
