name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Privacy scan (working tree)
        run: git ls-files -z | xargs -0 python scripts/privacy_scan.py
      - name: Commit messages (no co-author or AI attribution lines)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            range="$PUSH_AFTER"
          fi
          git log --format=%B "$range" | python scripts/check_commit_msg.py -
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Tests
        working-directory: server
        run: uv run pytest
      - name: Lint
        working-directory: server
        run: uv run ruff check . ../scripts

  audit:
    # Known vulnerabilities in any pinned dependency fail the build: the server's lock file,
    # the sandbox image's hash-pinned packages, and the web app's npm packages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Server dependencies
        working-directory: server
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/server.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/server.txt" --disable-pip --progress-spinner off
      - name: Sandbox image packages
        working-directory: server/src/hearthkeep/sandbox/image
        run: uvx pip-audit@2.10.1 -r requirements.txt --disable-pip --progress-spinner off
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Web packages
        working-directory: web
        run: npm audit --audit-level=moderate

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('web/package.json') != ''
        with:
          node-version: "22"
      - name: Install, test, build
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
