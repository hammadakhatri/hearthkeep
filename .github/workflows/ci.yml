name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Privacy scan (working tree)
        run: git ls-files -z | xargs -0 python scripts/privacy_scan.py
      - name: Commit messages (no co-author or AI attribution lines)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            range="$PUSH_AFTER"
          fi
          git log --format=%B "$range" | python scripts/check_commit_msg.py -
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Tests
        working-directory: server
        run: uv run pytest
      - name: Lint
        working-directory: server
        run: uv run ruff check . ../scripts

  audit:
    # Known vulnerabilities in any pinned dependency fail the build: the server's lock file,
    # the sandbox image's hash-pinned packages, and the web app's npm packages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Server dependencies
        working-directory: server
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/server.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/server.txt" --disable-pip --progress-spinner off
      - name: Sandbox image packages
        working-directory: server/src/hearthkeep/sandbox/image
        run: uvx pip-audit@2.10.1 -r requirements.txt --disable-pip --progress-spinner off
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Web packages
        working-directory: web
        run: npm audit --audit-level=moderate

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('web/package.json') != ''
        with:
          node-version: "22"
      - name: Install, test, build
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
